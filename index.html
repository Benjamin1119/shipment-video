<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>包裝出貨自動錄影系統</title>
  <!-- 引入動態條碼辨識庫 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 16px; background: #f4f6f8; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    label { font-weight: bold; font-size: 14px; margin-bottom: 6px; display: block; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; text-align: center; font-weight: bold; }
    
    #interactive-scanner { width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; display: none; }
    #videoInput { display: none; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
    .btn-scan { background: #1a73e8; color: white; }
    .btn-record { background: #34a853; color: white; }
    .btn-upload { background: #fbbc04; color: #000; display: none; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    #status { text-align: center; font-weight: bold; margin-top: 10px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>包裝出貨自動錄影</h2>
  
  <label for="barcode">條碼單號：</label>
  <input type="text" id="barcode" placeholder="請點下方按鈕自動掃碼">

  <!-- 即時動態掃條碼鏡頭區域 -->
  <div id="interactive-scanner"></div>

  <button id="btnScan" class="btn btn-scan" onclick="startLiveScanner()">📷 開啟動態鏡頭掃條碼</button>

  <!-- 原生錄影觸發器 -->
  <input type="file" id="videoInput" accept="video/*" capture="environment" onchange="handleVideoSelect(event)">
  
  <button id="btnRecord" class="btn btn-record" onclick="triggerVideoCamera()">🎥 開啟相機錄影</button>
  <button id="btnUpload" class="btn btn-upload" onclick="uploadVideo()">☁️ 確定並上傳影片</button>

  <div id="status">請先點擊「開啟動態鏡頭掃條碼」</div>
</div>

<script>
  // ⚠️ 請填入您的 Google Apps Script Web App URL
  const GAS_API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"; 
  
  let html5Scanner = null;
  let selectedVideoFile = null;

  function startLiveScanner() {
    const scannerDiv = document.getElementById('interactive-scanner');
    scannerDiv.style.display = 'block';
    document.getElementById('status').innerText = "🔍 請對準條碼（對焦中...）";

    // 強制指定一維物流/商品條碼格式，大幅提升解碼速度與精準度
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    html5Scanner = new Html5Qrcode("interactive-scanner", { formatsToSupport: formatsToSupport });

    // 強制要求高清 720p/1080p 解析度，確保線條清晰
    const config = { 
      fps: 20, 
      qrbox: (vWidth, vHeight) => ({ width: Math.floor(vWidth * 0.85), height: Math.floor(vHeight * 0.45) }),
      videoConstraints: {
        facingMode: { exact: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    html5Scanner.start(
      { facingMode: "environment" }, 
      config,
      (decodedText) => {
        document.getElementById('barcode').value = decodedText;
        document.getElementById('status').innerText = "✅ 自動掃描成功：" + decodedText;
        stopScanner();
      },
      (error) => { /* 背景持續比對 */ }
    ).catch(err => {
      // 備援：若 exact environment 失敗，切換普通後鏡頭
      html5Scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 280, height: 120 } }, (decodedText) => {
        document.getElementById('barcode').value = decodedText;
        document.getElementById('status').innerText = "✅ 自動掃描成功：" + decodedText;
        stopScanner();
      }).catch(e => {
        document.getElementById('status').innerText = "❌ 鏡頭啟動失敗：" + e;
      });
    });
  }

  function stopScanner() {
    if (html5Scanner) {
      html5Scanner.stop().then(() => {
        html5Scanner.clear();
        document.getElementById('interactive-scanner').style.display = 'none';
      }).catch(() => {});
    }
  }

  function triggerVideoCamera() {
    const barcode = document.getElementById('barcode').value.trim();
    if (!barcode) {
      alert("請先掃描或輸入條碼單號！");
      return;
    }
    stopScanner();
    document.getElementById('videoInput').click();
  }

  function handleVideoSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    selectedVideoFile = file;
    document.getElementById('btnUpload').style.display = "block";
    document.getElementById('status').innerText = "📹 影片錄製完成，請點擊「確定並上傳影片」";
  }

  function uploadVideo() {
    if (!selectedVideoFile) return;

    const barcode = document.getElementById('barcode').value.trim();
    const status = document.getElementById('status');
    const btnUpload = document.getElementById('btnUpload');

    btnUpload.disabled = true;
    status.innerText = "⏳ 正在將影片傳送至 Google Drive...";

    const reader = new FileReader();
    reader.onloadend = function() {
      const payload = {
        barcode: barcode,
        videoData: reader.result
      };

      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btnUpload.disabled = false;
        btnUpload.style.display = "none";
        if (data.success) {
          status.innerText = "✅ 上傳成功！檔名：" + data.fileName;
          document.getElementById('barcode').value = "";
        } else {
          status.innerText = "❌ 上傳失敗：" + data.error;
        }
      })
      .catch(err => {
        btnUpload.disabled = false;
        status.innerText = "❌ 傳送完成：" + err;
      });
    };

    reader.readAsDataURL(selectedVideoFile);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>包裝出貨自動錄影系統</title>
  <!-- 引入專為 1D 一維條碼打造的高速解碼庫 Quagga2 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 16px; background: #f4f6f8; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    label { font-weight: bold; font-size: 14px; margin-bottom: 6px; display: block; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; text-align: center; font-weight: bold; }
    
    #interactive-scanner { width: 100%; height: 250px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; display: none; position: relative; }
    #interactive-scanner video { width: 100%; height: 100%; object-fit: cover; }
    #interactive-scanner canvas.drawingBuffer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    #videoInput { display: none; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
    .btn-scan { background: #1a73e8; color: white; }
    .btn-record { background: #34a853; color: white; }
    .btn-upload { background: #fbbc04; color: #000; display: none; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    #status { text-align: center; font-weight: bold; margin-top: 10px; font-size: 14px; word-break: break-all; }

    /* 彈跳視窗 Modal 樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      animation: popup 0.2s ease-out;
    }
    @keyframes popup {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-card h3 { margin-top: 0; color: #1a73e8; font-size: 20px; }
    .modal-subtitle { font-size: 14px; color: #555; margin-bottom: 14px; }
    .modal-input {
      width: 100%;
      padding: 14px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border: 2px solid #1a73e8;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #f0f4f9;
      color: #111;
      letter-spacing: 1px;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-confirm { background: #34a853; color: white; margin-bottom: 0; }
    .btn-retry { background: #dc3545; color: white; margin-bottom: 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>包裝出貨自動錄影</h2>
  
  <label for="barcode">條碼單號：</label>
  <input type="text" id="barcode" placeholder="請點下方按鈕自動掃碼">

  <!-- 即時動態掃條碼區域 -->
  <div id="interactive-scanner"></div>

  <button id="btnScan" class="btn btn-scan" onclick="startLiveScanner()">📷 開啟極速條碼掃描</button>

  <!-- 原生錄影觸發器 -->
  <input type="file" id="videoInput" accept="video/*" capture="environment" onchange="handleVideoSelect(event)">
  
  <button id="btnRecord" class="btn btn-record" onclick="triggerVideoCamera()">🎥 開啟相機錄影</button>
  <button id="btnUpload" class="btn btn-upload" onclick="uploadVideo()">☁️ 確定並上傳影片</button>

  <div id="status">請先點擊「開啟極速條碼掃描」</div>
</div>

<!-- 條碼確認彈跳視窗 Modal -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-card">
    <h3>🔍 請核對條碼單號</h3>
    <div class="modal-subtitle">請比對託運單，若有誤可直接點擊修改：</div>
    <input type="text" id="modalBarcodeDisplay" class="modal-input" autofocus>
    <div class="modal-actions">
      <button class="btn btn-confirm" onclick="confirmBarcodeAndRecord()">✅ 正確，開啟錄影</button>
      <button class="btn btn-retry" onclick="rescanBarcode()">🔄 判讀錯誤，重新掃描</button>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App URL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbykyXpsrAhTuS6wwjto-omnQXEuW84mupGB319fMl_OtjqsVmq8q4yX2XZReccJwiRU/exec"; 
  
  let isScanning = false;
  let selectedVideoFile = null;

  function startLiveScanner() {
    const scannerDiv = document.getElementById('interactive-scanner');
    scannerDiv.style.display = 'block';
    document.getElementById('status').innerText = "🔍 請將條碼保持離鏡頭 20-30 公分（對焦中）...";

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive-scanner'),
        constraints: {
          width: { min: 640, ideal: 1280 },
          height: { min: 480, ideal: 720 },
          facingMode: "environment"
        }
      },
      locator: {
        patchSize: "medium",
        halfSample: true
      },
      numOfWorkers: navigator.hardwareConcurrency || 4,
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "code_39_reader",
          "ean_8_reader",
          "upc_reader"
        ]
      },
      locate: true
    }, function(err) {
      if (err) {
        document.getElementById('status').innerText = "❌ 鏡頭啟動失敗：" + err;
        return;
      }
      Quagga.start();
      isScanning = true;
    });

    // 監聽掃描結果
    Quagga.onDetected(function(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const code = result.codeResult.code;
        stopScanner();
        showConfirmModal(code);
      }
    });
  }

  function stopScanner() {
    if (isScanning) {
      Quagga.stop();
      document.getElementById('interactive-scanner').style.display = 'none';
      isScanning = false;
    }
  }

  // 顯示彈跳確認視窗
  function showConfirmModal(code) {
    document.getElementById('modalBarcodeDisplay').value = code;
    document.getElementById('confirmModal').style.display = 'flex';
    document.getElementById('status').innerText = "⚠️ 請在彈跳視窗中核對條碼數值";
  }

  // 關閉彈跳視窗
  function hideConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  // 使用者點擊「✅ 正確，開啟錄影」
  function confirmBarcodeAndRecord() {
    const confirmedCode = document.getElementById('modalBarcodeDisplay').value.trim();
    if (!confirmedCode) {
      alert("請輸入或確認條碼單號！");
      return;
    }
    document.getElementById('barcode').value = confirmedCode;
    hideConfirmModal();
    document.getElementById('status').innerText = "✅ 條碼已確認：" + confirmedCode;
    
    // 自動進入開啟相機錄影步驟
    triggerVideoCamera();
  }

  // 使用者點擊「🔄 判讀錯誤，重新掃描」
  function rescanBarcode() {
    hideConfirmModal();
    startLiveScanner();
  }

  function triggerVideoCamera() {
    const barcode = document.getElementById('barcode').value.trim();
    if (!barcode) {
      alert("請先掃描或輸入條碼單號！");
      return;
    }
    stopScanner();
    document.getElementById('videoInput').click();
  }

  function handleVideoSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    selectedVideoFile = file;
    document.getElementById('btnUpload').style.display = "block";
    document.getElementById('status').innerText = "📹 影片錄製完成，請點擊「確定並上傳影片」";
  }

  function uploadVideo() {
    if (!selectedVideoFile) return;

    const barcode = document.getElementById('barcode').value.trim();
    const status = document.getElementById('status');
    const btnUpload = document.getElementById('btnUpload');

    btnUpload.disabled = true;
    status.innerText = "⏳ 正在將影片傳送至 Google Drive...";

    const reader = new FileReader();
    reader.onloadend = function() {
      const payload = {
        barcode: barcode,
        videoData: reader.result
      };

      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btnUpload.disabled = false;
        btnUpload.style.display = "none";
        if (data.success) {
          status.innerText = "✅ 上傳成功！檔名：" + data.fileName;
          document.getElementById('barcode').value = "";
        } else {
          status.innerText = "❌ 上傳失敗：" + data.error;
        }
      })
      .catch(err => {
        btnUpload.disabled = false;
        status.innerText = "❌ 傳送完成：" + err;
      });
    };

    reader.readAsDataURL(selectedVideoFile);
  }
</script>

</body>
</html>
